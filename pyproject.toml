[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodayshield"
version = "0.1.0"
description = "Reproducible evaluation of network anomaly detectors on held-out attack families"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<1.8",
  "pyarrow>=17,<25",
  "polars-lts-cpu>=1.30,<2",
  "matplotlib>=3.9,<4",
  "scikit-posthocs>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
